qrels_path: Data/qrels.csv 
csv_path: Data/Training-Data/Amazon_Laptop_Specs_utf8.csv    
k: 5
k_each: 25
seed: 42
grid: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45,
       0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]

# Selection strategy (BEST PRACTICE)
select: cv            # use cross-validation on the non-test pool
cv_folds: 5           # number of folds
one_std_err: false    # false = strict CV argmax; true = prefer simpler α within 1 std-err
tie_break: min_alpha  # when means tie, choose smallest α (or "max_train")

